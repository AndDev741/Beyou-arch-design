          description: Consecutive days with a review, ending today or yesterday.
    RoadmapDraftDTO:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DraftNodeDTO'
        totalHours:
          type: integer
          format: int32
          description: The estimate for the nodes that are not optional.
      description: A proposal. Nothing is stored until the person creates it.
    RoadmapDraftRequestDTO:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
          description: The subject.
        why:
          type: string
          maxLength: 600
          minLength: 0
          description: What the person is studying it for. The model shapes the roadmap and the optional
            flags around it.
        level:
          type: string
          enum:
          - NEW
          - SOME
          - SOLID
          description: NEW to the subject, knows SOME of it, or SOLID foundations and wants depth.
        hoursPerWeek:
          type: integer
          format: int32
          maximum: 80
          minimum: 1
          description: Time available, which feeds the hour estimates.
        goalId:
          type: string
          format: uuid
          description: A goal this serves, named to the model. Somebody else's goal is left out without
            an error.
        references:
          type: array
          items:
            type: string
            maxLength: 500
            minLength: 0
          maxItems: 5
          minItems: 0
          description: Books, courses or syllabi to base it on, as free text.
        changeRequest:
          type: string
          maxLength: 500
          minLength: 0
          description: 'With previous: what to change in the current draft.'
        previous:
          type: array
          items:
            $ref: '#/components/schemas/DraftNodeInputDTO'
          maxItems: 20
          minItems: 0
          description: The current draft, when asking for a revision.
      required:
      - title
    RoadmapDraftRecordDTO:
      type: object
      description: A stored draft, enough to put the dialog back where the person left it.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
          - DRAFTING
          - READY
          - FAILED
          description: DRAFTING while the model writes it in the background.
        request:
          $ref: '#/components/schemas/RoadmapDraftRequestDTO'
        result:
          $ref: '#/components/schemas/RoadmapDraftDTO'
          description: Null until the first call ends. During a redraft, still the previous result.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/DraftChoiceDTO'
          description: One per node of `result`, or null when the person has not changed any.
        errorKey:
          type: string
          description: Why a FAILED draft failed, AI_UNAVAILABLE or NOTEBOOK_DRAFT_INTERRUPTED.
        startedAt:
          type: string
          format: date-time
          description: When the current or last model call began, for the dialog's timer.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoadmapDraftSummaryDTO:
      type: object
      description: A draft as the notebook home lists it.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
          - DRAFTING
          - READY
          - FAILED
        nodeCount:
          type: integer
          format: int32
        errorKey:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SetStatusRequestDTO:
      type: object
      properties:
        status:
          type: string
          enum:
          - TO_STUDY
          - STUDYING
          - DONE
          - AUTO
          description: TO_STUDY, STUDYING or DONE sets the status by hand. On a page whose board has nodes
            that pins it, and the nodes stop moving it. AUTO hands the page back to its nodes and recomputes
            its status at once; on a leaf it changes nothing.
      required:
      - status
      description: A status, or AUTO.
    SourceDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        pageTitle:
          type: string
          description: The page the source was added to.
        inherited:
          type: boolean
          description: True when it was added to an ancestor of the page that was asked about.
        kind:
          type: string
          enum:
          - PDF
          - LINK
          - TEXT
        title:
          type: string
          description: The file name for a PDF, host and path for a link, the given title for text.
        url:
          type: string
          description: LINK only.
        status:
          type: string
          enum:
          - PENDING
          - READING
          - READY
          - FAILED
          description: PENDING until the background job starts, READING while it runs, then READY or FAILED.
        progress:
          type: integer
          format: int32
          description: 0 to 100 while READING.
        errorKey:
          type: string
          description: Why it FAILED, as an error key the clients translate.
        enabled:
          type: boolean
          description: Off keeps the source listed and stops the AI reading it.
        pageCount:
          type: integer
          format: int32
          description: Pages read, for a PDF.
        charCount:
          type: integer
          format: int32
          description: Characters of text kept.
        createdAt:
          type: string
          format: date-time
      description: A source as the page's source list shows it.
    StatusChangeResponseDTO:
      type: object
      properties:
        pageId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - TO_STUDY
          - STUDYING
          - DONE
        statusManual:
          type: boolean
        changed:
          type: array
          items:
            $ref: '#/components/schemas/PageStatusDTO'
          description: Every page whose status moved, this one included.
        xpEarned:
          type: number
          format: double
          description: XP this call paid in total. 0 when nothing finished for the first time.
        refreshUi:
          $ref: '#/components/schemas/RefreshUiDTO'
          description: Present only when XP was paid.
      description: What one status change did, across every board it reached.
    StudyOutputDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - OVERVIEW
          - SUMMARY
          - STUDY_GUIDE
          - QUIZ
        title:
          type: string
        markdown:
          type: string
          description: The text of an overview, summary or study guide. Null on a quiz.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationDTO'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionDTO'
          description: Quiz only, without the answers.
        score:
          type: integer
          format: int32
          description: The last grading. Quiz only.
        total:
          type: integer
          format: int32
          description: Questions in the last grading. Quiz only.
        passedAt:
          type: string
          format: date-time
          description: When the quiz was first passed, which is when its XP was paid.
        createdAt:
          type: string
          format: date-time
      description: A saved study-room output. A quiz never carries its answers here.
    StudyResponseDTO:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageRefDTO'
        breadcrumb:
          type: array
          items:
            $ref: '#/components/schemas/PageRefDTO'
        overview:
          $ref: '#/components/schemas/OverviewDTO'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageDTO'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/StudyOutputDTO'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDTO'
        cardsTotal:
          type: integer
          format: int32
        cardsDue:
          type: integer
          format: int32
        setup:
          $ref: '#/components/schemas/StudySetupDTO'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/StudyScopeOptionDTO'
          description: What each notes scope would read, for the setup screen.
        discovery:
          type: boolean
          description: Whether "find sources for me" has a web search configured.
    StudyScopeOptionDTO:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/StudyScope'
        pages:
          type: integer
          format: int32
          description: Pages in the scope that have notes.
        words:
          type: integer
          format: int32
          description: Words of notes across them.
    StudyScope:
      type: string
      enum:
      - PAGE
      - SUBTREE
      - TOPIC
      description: |
        Whose notes the study AI reads. PAGE is the page and the pages above it, which is what the
        room read before the setup existed and stays the default. SUBTREE adds every page under it,
        TOPIC every page of the topic. Sources keep their own rule either way.
    StudySetupDTO:
      type: object
      properties:
        goal:
          type: string
          description: What the person wants out of studying the page; sent with every answer.
        scope:
          $ref: '#/components/schemas/StudyScope'
        configuredAt:
          type: string
          format: date-time
          description: When the setup was last saved; null opens the room on its setup screen.
    StudySetupRequestDTO:
      type: object
      properties:
        goal:
          type: string
          maxLength: 300
          minLength: 0
          description: A blank goal clears it.
        scope:
          $ref: '#/components/schemas/StudyScope'
      required:
      - scope
    SuggestNodesRequestDTO:
      type: object
      properties:
        fromSources:
          type: boolean
          description: True grounds the suggestions in the page's notes and sources, and answers NOTEBOOK_NOTHING_TO_STUDY
            when there are none. False, the default, lets the model plan from its general knowledge of
            the subject.
    SuggestedNodeDTO:
      type: object
      properties:
        title:
          type: string
        why:
          type: string
    TopicDueDTO:
      type: object
      properties:
        topicId:
          type: string
          format: uuid
        title:
          type: string
        due:
          type: integer
          format: int32
    TopicLinksRequestDTO:
      type: object
      properties:
        goalId:
          type: string
          format: uuid
          description: Null clears the goal link.
        categoryId:
          type: string
          format: uuid
          description: Null clears it, and later XP goes to the person only.
        habitId:
          type: string
          format: uuid
          description: Null clears the habit link.
      description: The topic's three links, replaced together. Null clears a link.
    TopicSummaryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        icon:
          type: string
        description:
          type: string
        progress:
          $ref: '#/components/schemas/ProgressDTO'
        cardsDue:
          type: integer
          format: int32
          description: Due cards anywhere in the topic.
        sourcesCount:
          type: integer
          format: int32
          description: Sources added anywhere in the topic.
        next:
          $ref: '#/components/schemas/PageRefDTO'
          description: The leaf to study next. Null when everything is done.
        goal:
          $ref: '#/components/schemas/LinkRefDTO'
        habit:
          $ref: '#/components/schemas/LinkRefDTO'
        preview:
          type: array
          items:
            $ref: '#/components/schemas/MiniNodeDTO'
          description: The topic board's PAGE nodes, for the card's miniature.
        previewEdges:
          type: array
          items:
            $ref: '#/components/schemas/MiniEdgeDTO'
          description: The topic board's edges, for the miniature.
        updatedAt:
          type: string
          format: date-time
    TreeItemDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: The page's parent, or for a linked item the board page that shows it.
        title:
          type: string
        icon:
          type: string
        status:
          type: string
          enum:
          - TO_STUDY
          - STUDYING
          - DONE
        onBoard:
          type: boolean
          description: True for a node on its parent's board, false for a page made off the board.
        linked:
          type: boolean
          description: True for a page that lives in another topic and is shown here by a link.
        progress:
          $ref: '#/components/schemas/ProgressDTO'
        position:
          type: integer
          format: int32
          description: Board order for nodes. Pages off the board sort after them.
      description: One row of a topic's sidebar tree.
    TreeResponseDTO:
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/PageRefDTO'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreeItemDTO'
        sourcesCount:
          type: integer
          format: int32
          description: Sources added anywhere in the topic.
        cardsDue:
          type: integer
          format: int32
          description: Due cards anywhere in the topic.
    UpdateCardRequestDTO:
      type: object
      properties:
        front:
          type: string
          maxLength: 2000
          minLength: 0
          pattern: (?s).*\S.*
          description: Left out, it stays as it is.
        back:
          type: string
          maxLength: 2000
          minLength: 0
          pattern: (?s).*\S.*
          description: Left out, it stays as it is.
    UpdateContentRequestDTO:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000000
          minLength: 0
          description: The whole BlockNote document as a JSON string.
      required:
      - content
    UpdateNodeRequestDTO:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
          description: SECTION only, at least 80.
        height:
          type: number
          format: double
          description: SECTION only, at least 60.
        label:
          type: string
          maxLength: 255
          minLength: 0
          description: SECTION only. Blank is ignored.
    UpdatePageRequestDTO:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
          pattern: .*\S.*
          description: Must hold something other than whitespace.
        icon:
          type: string
          maxLength: 64
          minLength: 0
          description: Blank clears it.
        description:
          type: string
          maxLength: 512
          minLength: 0
          description: Blank clears it.
    UpdateSourceRequestDTO:
      type: object
      properties:
        enabled:
          type: boolean
          description: False keeps the source and stops the AI reading it.
      required:
      - enabled
