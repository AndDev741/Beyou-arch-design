openapi: 3.1.0
info:
  title: Schedules
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /schedule:
    get:
      tags:
      - schedule-controller
      operationId: getAllSchedules
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleResponseDTO'
    put:
      tags:
      - schedule-controller
      operationId: updateSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Schedule'
    post:
      tags:
      - schedule-controller
      operationId: createSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Schedule'
  /schedule/{scheduleId}:
    delete:
      tags:
      - schedule-controller
      operationId: deleteSchedule
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
components:
  schemas:
    CreateScheduleDTO:
      type: object
      properties:
        days:
          description: >-
            Week days the routine runs on. Responses always carry these canonical
            capitalized names, and that is what the schedule_days CHECK constraint
            stores. Requests are parsed leniently: any letter case (MONDAY, monday)
            and the Portuguese day names (segunda-feira, terca, sabado, with or
            without accents) resolve to the same value, so a near-miss costs nothing.
            An unknown name is rejected with the accepted values in the message.
          type: array
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          minItems: 1
          uniqueItems: true
        routineId:
          type: string
          format: uuid
      required:
      - days
      - routineId
    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        days:
          type: array
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          uniqueItems: true
    ScheduleResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        days:
          type: array
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          uniqueItems: true
    UpdateScheduleDTO:
      type: object
      properties:
        scheduleId:
          type: string
          format: uuid
        days:
          description: >-
            Week days the routine runs on. Responses always carry these canonical
            capitalized names, and that is what the schedule_days CHECK constraint
            stores. Requests are parsed leniently: any letter case (MONDAY, monday)
            and the Portuguese day names (segunda-feira, terca, sabado, with or
            without accents) resolve to the same value, so a near-miss costs nothing.
            An unknown name is rejected with the accepted values in the message.
          type: array
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          uniqueItems: true
        routineId:
          type: string
          format: uuid
