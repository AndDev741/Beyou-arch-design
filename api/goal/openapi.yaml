openapi: 3.1.0
info:
  title: Goals
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /goal:
    get:
      tags:
      - goal-controller
      operationId: getGoals
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalResponseDTO'
    put:
      tags:
      - goal-controller
      operationId: editGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGoalRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      tags:
      - goal-controller
      operationId: createGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /goal/increase:
    put:
      tags:
      - goal-controller
      operationId: increaseCurrentValue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalValueDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GoalResponseDTO'
  /goal/decrease:
    put:
      tags:
      - goal-controller
      operationId: decreaseCurrentValue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalValueDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GoalResponseDTO'
  /goal/complete:
    put:
      tags:
      - goal-controller
      operationId: setAsComplete
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: uuid
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefreshUiDTO'
  /goal/{goalId}:
    delete:
      tags:
      - goal-controller
      operationId: deleteGoal
      parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
components:
  schemas:
    BaseCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkDate:
          type: string
          format: date
        checkTime:
          type: string
        checked:
          type: boolean
        skipped:
          type: boolean
        xpGenerated:
          type: number
          format: double
    CategoryMiniDTO:
      type: object
      properties:
        name:
          type: string
        iconId:
          type: string
    CreateGoalRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 2
        description:
          type: string
        iconId:
          type: string
        targetValue:
          type: number
          format: double
        unit:
          type: string
          minLength: 1
        currentValue:
          type: number
          format: double
        categoriesId:
          type: array
          items:
            type: string
            format: uuid
        motivation:
          type: string
          maxLength: 256
          minLength: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
        term:
          type: string
          enum:
          - SHORT_TERM
          - MEDIUM_TERM
          - LONG_TERM
      required:
      - categoriesId
      - currentValue
      - endDate
      - name
      - startDate
      - status
      - targetValue
      - term
      - unit
    EditGoalRequestDTO:
      type: object
      properties:
        goalId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 256
          minLength: 2
        iconId:
          type: string
        description:
          type: string
        targetValue:
          type: number
          format: double
        unit:
          type: string
          minLength: 1
        currentValue:
          type: number
          format: double
        complete:
          type: boolean
        categoriesId:
          type: array
          items:
            type: string
            format: uuid
        motivation:
          type: string
          maxLength: 256
          minLength: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
        term:
          type: string
          enum:
          - SHORT_TERM
          - MEDIUM_TERM
          - LONG_TERM
      required:
      - categoriesId
      - complete
      - currentValue
      - endDate
      - goalId
      - name
      - startDate
      - status
      - targetValue
      - term
      - unit
    GoalResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconId:
          type: string
        description:
          type: string
        targetValue:
          type: number
          format: double
        unit:
          type: string
        currentValue:
          type: number
          format: double
        complete:
          type: boolean
        categories:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CategoryMiniDTO'
        motivation:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        xpReward:
          type: number
          format: double
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
        term:
          type: string
          enum:
          - SHORT_TERM
          - MEDIUM_TERM
          - LONG_TERM
        completeDate:
          type: string
          format: date
    RefreshItemCheckedDTO:
      type: object
      properties:
        groupItemId:
          type: string
          format: uuid
        check:
          $ref: '#/components/schemas/BaseCheck'
    RefreshObjectDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
        currentStreak:
          type: integer
          format: int32
        bestStreak:
          type: integer
          format: int32
        totalCheckIns:
          type: integer
          format: int32
    RefreshUiDTO:
      type: object
      properties:
        refreshUser:
          $ref: '#/components/schemas/RefreshUserDTO'
        refreshCategories:
          type: array
          items:
            $ref: '#/components/schemas/RefreshObjectDTO'
        refreshHabit:
          $ref: '#/components/schemas/RefreshObjectDTO'
        refreshItemChecked:
          $ref: '#/components/schemas/RefreshItemCheckedDTO'
    RefreshUserDTO:
      type: object
      properties:
        currentConstance:
          type: integer
          format: int32
        alreadyIncreaseConstanceToday:
          type: boolean
        maxConstance:
          type: integer
          format: int32
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
    UpdateGoalValueDTO:
      type: object
      properties:
        goalId:
          type: string
          format: uuid
        value:
          type: number
          format: double
      required:
      - goalId
