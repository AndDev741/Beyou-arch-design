openapi: 3.1.0
info:
  title: Feedback admin
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /feedback/admin/items/{feedbackId}/status:
    put:
      tags:
      - feedback-admin-controller
      operationId: updateStatus
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeedbackStatusRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackAdminItemDTO'
  /feedback/admin/items/{feedbackId}/replies:
    post:
      tags:
      - feedback-admin-controller
      operationId: reply
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackReplyRequestDTO'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackReplyDTO'
  /feedback/admin/items:
    get:
      tags:
      - feedback-admin-controller
      operationId: listSubmissions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - TAKING_CARE
          - CLOSED
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - BUG
          - FEATURE_REQUEST
          - OTHER
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackAdminPageDTO'
  /feedback/admin/items/{feedbackId}:
    get:
      tags:
      - feedback-admin-controller
      operationId: getSubmission
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackAdminDetailDTO'
  /feedback/admin/counts:
    get:
      tags:
      - feedback-admin-controller
      operationId: countSubmissions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackStatusCountsDTO'
components:
  schemas:
    CreateFeedbackReplyRequestDTO:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - body
    FeedbackAdminDetailDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - BUG
          - FEATURE_REQUEST
          - OTHER
        status:
          type: string
          enum:
          - OPEN
          - TAKING_CARE
          - CLOSED
        body:
          type: string
        context:
          $ref: '#/components/schemas/FeedbackContextDTO'
        submitter:
          $ref: '#/components/schemas/FeedbackSubmitterDTO'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAttachmentDTO'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackReplyDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeedbackAdminItemDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - BUG
          - FEATURE_REQUEST
          - OTHER
        status:
          type: string
          enum:
          - OPEN
          - TAKING_CARE
          - CLOSED
        body:
          type: string
        context:
          $ref: '#/components/schemas/FeedbackContextDTO'
        submitter:
          $ref: '#/components/schemas/FeedbackSubmitterDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeedbackAdminPageDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAdminItemDTO'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    FeedbackAttachmentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feedbackId:
          type: string
          format: uuid
        url:
          type: string
        contentType:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    FeedbackContextDTO:
      type: object
      properties:
        screen:
          type: string
          maxLength: 200
          minLength: 0
        appVersion:
          type: string
          maxLength: 40
          minLength: 0
        platform:
          type: string
          maxLength: 40
          minLength: 0
        language:
          type: string
          maxLength: 20
          minLength: 0
        theme:
          type: string
          maxLength: 40
          minLength: 0
    FeedbackReplyDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feedbackId:
          type: string
          format: uuid
        body:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
    FeedbackStatusCountsDTO:
      type: object
      properties:
        open:
          type: integer
          format: int64
        takingCare:
          type: integer
          format: int64
        closed:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    FeedbackSubmitterDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    UpdateFeedbackStatusRequestDTO:
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - TAKING_CARE
          - CLOSED
      required:
      - status
