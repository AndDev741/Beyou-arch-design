openapi: 3.1.0
info:
  title: Daily Briefing
  version: v0
  description: |
    The dialog a user meets on the first dashboard open of a new day: what is still open from
    yesterday, and what today holds.

    **Neither route takes a date.** The day is always the caller's own today, resolved from the
    account's timezone. Letting a client name it would put the device's clock in charge of which
    day is described and which row `seen` marks, and the two clients would disagree the moment
    one of them sat in a different zone from the account.

    **The response has two halves with different guarantees, and telling them apart is the whole
    design.** `yesterday` and `today` are computed from the database on every read and always
    arrive. `narrative` is generated prose and often will not; its `status` says why. A client
    that finds no lines renders its own translated copy rather than an empty panel.

    Every figure a user reads is computed on the server, never by the model. A free-tier model
    asked to work out which goals are at risk gets the arithmetic wrong, invents goals, and
    answers differently each morning for identical data. The model receives finished numbers,
    which means the numbers on screen are always right AND that a morning with the whole LLM
    chain in cooldown still produces a usable dialog.

    What the model is asked to do with them changed once. The first version handed it only what
    the panel already renders and asked it to phrase that, and every morning it wrote the panel
    back out as prose. It now gets two weeks of signals the screen does not show (completion this
    week against the week before, habits slipping and holding, mood levels and their trend, each
    goal's pace) and is told to talk about those and not to restate what is on screen. Mood
    reaches it as levels only. The journal text never enters the briefing at all: the clients read
    yesterday's entry from `GET /mood` themselves, so the summary cannot quote what it never saw.

    That is also why this endpoint never answers `AI_UNAVAILABLE` the way
    `POST /onboarding/suggestions` does. There, the suggestions ARE the response; here the prose
    is the optional half, so the answer is 200 whatever the chain does.

    **The prose is generated once per day, on demand, and cached.** Deliberately not in the
    nightly day-close pass: that walks every account that exists, so a model call inside it would
    spend the quota of people who open the app on people who do not, and it would write the
    "today" half at 02:00 before anything about today had happened. An account that never opens
    the dialog creates no row at all.

    **Acting on an open item does NOT happen here.** Each entry in `openItems` carries the
    `snapshotId` and `snapshotCheckId` that `POST /routine/snapshot/check` and
    `POST /routine/snapshot/skip` already take. Those endpoints own the retroactive rules (XP
    decay, the outcome stamped on the snapshot's own date, the ownership check), and the briefing
    hands over the ids rather than growing a second way to do the same thing.

    `GET` sits in its own `briefing` rate-limit tier at 10 an hour rather than the generic 60 a
    minute for reads: the first call of a day creates a row and may hold the request for up to
    eight seconds waiting on the model. `GET /narrative` is matched out of that tier on purpose
    and spends the generic read budget instead, because it is the client polling for prose a
    dozen times over a minute, a primary-key read that never calls the model. `POST /seen` stays
    in the generic `write` tier, being a single-column update with no model behind it.
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /daily-briefing:
    get:
      tags:
      - daily-briefing-controller
      operationId: getBriefing
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DailyBriefingResponseDTO'
      summary: The caller's briefing for their own today
      description: |
        Get-or-create. The first call of a user's day computes the facts, persists a row and
        starts the narration; every later call recomputes the facts and reads the prose off the
        row.

        The facts are deliberately NOT cached. The user can change them from inside the dialog:
        checking a forgotten habit moves the counts underneath, so a cached copy would need
        invalidating from every check path, which is a worse trade than the ten or so indexed
        queries a fresh read costs.

        The narration is bounded rather than awaited: about eight seconds, after which the
        response carries `PENDING` and the call is left running to store itself. A client that
        gets `PENDING` polls `GET /daily-briefing/narrative` while the dialog is open. Before that
        route existed the plan was for "the next open of the same day" to find the prose, and
        there is no next open: the dialog shows once a day, so for weeks every narration in
        production landed `READY` in its row and none reached a screen. Concurrent callers join
        one in-flight call, so two devices opening together cannot buy the same paragraph twice.

        A briefing with nothing in it (no routine yesterday, nothing scheduled today, no open goal
        and no expiring day) still answers 200, but creates no row and is not worth
        showing. Both clients apply the same rule and stay silent. A dialog that greets somebody
        every morning with "nothing happened" is how you teach them to close it unread.
  /daily-briefing/narrative:
    get:
      tags:
      - daily-briefing-controller
      operationId: getNarrative
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BriefingNarrativeDTO'
      summary: Today's prose alone, for a client polling after PENDING
      description: |
        Read only. It never starts a narration and never recomputes the facts, which is why it is
        its own route and not a second `GET /daily-briefing`: that one costs a briefing token and
        a dozen queries, and polling it would spend the ten-an-hour allowance inside a minute.

        `PENDING` only while a call is genuinely running on this instance. A `PENDING` row with
        nothing behind it (a restart mid-call, a saturated pool, narration switched off) answers
        `UNAVAILABLE` so the client stops asking, and nothing is written: the next full
        `GET /daily-briefing` still sees `PENDING` and starts the call again. No row at all also
        answers `UNAVAILABLE`.

        The clients ask on a fixed schedule of about seventy seconds in ten requests
        (`pollNarrative` in `@beyou/state`), and give up to `UNAVAILABLE` themselves when it runs
        out, so a skeleton always ends.
  /daily-briefing/seen:
    post:
      tags:
      - daily-briefing-controller
      operationId: markSeen
      responses:
        '204':
          description: No Content
      summary: Records that the user has seen today's dialog
      description: |
        Server-side rather than in each client's local storage, which is the entire reason this
        route exists: closing yesterday's loose ends on a phone has to close the dialog on the
        web too.

        Idempotent, and the FIRST acknowledgement is the one kept. Re-stamping on every call
        would make the value useless for telling how long somebody took to open the app.

        A day with no row is a no-op: nothing has been shown, so there is nothing to acknowledge.

        204 because there is nothing useful to return. The client already knows what it just did,
        and a body would only invite it to re-render.
components:
  schemas:
    BriefingOpenItemDTO:
      type: object
      description: |
        One thing a past day is still waiting on. `snapshotId` and `snapshotCheckId` are exactly
        what the snapshot check and skip routes take.
      properties:
        snapshotId:
          type: string
          format: uuid
        snapshotCheckId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The day this belongs to. Not always yesterday, since older days arrive under `today.recovery`.
        routineId:
          type: string
          format: uuid
        routineName:
          type: string
        itemType:
          type: string
          enum:
          - HABIT
          - TASK
        itemName:
          type: string
        itemIconId:
          type: string
        sectionName:
          type: string
        xpIfCheckedNow:
          type: number
          format: double
          description: |
            What checking this right now would actually pay, after the account's XP decay
            strategy. Both clients show it. Somebody who checks a forgotten habit and watches a
            smaller number than usual land, with no explanation, reads it as a bug rather than as
            the rule it is.
    BriefingYesterdayRecapDTO:
      type: object
      description: |
        The day that just ended, read entirely from its `RoutineSnapshot` rows. After the midnight
        pass the live checks for the date are deleted, so the snapshot is not merely the
        convenient source, it is the only one.
      properties:
        date:
          type: string
          format: date
        hadRoutine:
          type: boolean
          description: |
            Whether any routine covered the day. False means nothing was ASKED of the user, which
            is not the same as a day they ignored, and must never be rendered as a failure.
        complete:
          type: boolean
          description: Every routine of the day finished, under the account's own constance setting.
        doneCount:
          type: integer
          format: int32
        skippedCount:
          type: integer
          format: int32
          description: Deliberate skips. A choice the user made; never counted against them.
        xpEarned:
          type: number
          format: double
        openItems:
          type: array
          description: Neither checked nor skipped, and therefore still actionable.
          items:
            $ref: '#/components/schemas/BriefingOpenItemDTO'
        focusCycles:
          type: integer
          format: int32
        moodLevel:
          type: integer
          format: int32
          description: The 1-5 mood logged for the day, or absent if none was.
    BriefingGoalAheadDTO:
      type: object
      description: |
        A goal worth mentioning this morning, with its pace. Overdue goals are kept rather than
        hidden: a goal whose date has passed with the target unmet is worth saying. The pace
        fields are computed on the server for the same reason the percentage is: two clients
        would each pick their own tolerance and disagree about whether one goal is behind.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconId:
          type: string
        currentValue:
          type: number
          format: double
        targetValue:
          type: number
          format: double
        unit:
          type: string
        endDate:
          type: string
          format: date
        daysRemaining:
          type: integer
          format: int64
          description: Whole days from today. Negative means overdue.
        percentComplete:
          type: integer
          format: int32
        remainingValue:
          type: number
          format: double
          description: How far the current value is from the target, never negative.
        requiredPerDay:
          type: number
          format: double
          description: |
            What each day from today through the end date has to add to land on the target,
            today included, to one decimal. Absent once the goal is overdue or the target is met:
            neither has a daily amount to ask for.
        expectedPercent:
          type: integer
          format: int32
          description: |
            Where a straight line from the start date to the end date says the goal should be by
            today, 0 to 100. The clients draw it as a tick on the progress bar.
        pace:
          type: string
          enum:
          - ON_TRACK
          - BEHIND
          - OVERDUE
          - REACHED
          description: |
            The verdict against that straight line. `BEHIND` means more than five percentage
            points under it; less than that is noise on any real week. `REACHED` is a met target
            not yet marked done, and it is worth its own state because a goal's XP is paid by
            `PUT /goal/complete`, not by reaching the number.
    BriefingRecoveryWindowDTO:
      type: object
      description: |
        Days older than yesterday that a retroactive check would still be accepted for. Absent
        when there are none, so a client renders no affordance rather than an empty one.
        Yesterday itself is excluded: it is the main list's own subject.
      properties:
        oldestOpenDay:
          type: string
          format: date
        daysUntilExpiry:
          type: integer
          format: int64
          description: Days before `oldestOpenDay` falls out of the backfill window. 1 means tonight is the last chance.
        remainingXpPercent:
          type: integer
          format: int32
          description: What a check on that day still pays, as a percentage. Legitimately 0 under the TIME_WINDOW strategy.
        openItems:
          type: array
          items:
            $ref: '#/components/schemas/BriefingOpenItemDTO'
    BriefingTodayAheadDTO:
      type: object
      properties:
        scheduledItemCount:
          type: integer
          format: int32
        scheduledToday:
          type: boolean
          description: |
            Whether any routine covers today. False means nothing is at risk: the account streak
            counts scheduled days, so a day with nothing on it cannot break one.
        currentStreak:
          type: integer
          format: int32
        bestStreak:
          type: integer
          format: int32
        goalsApproaching:
          type: array
          description: |
            Goals ending within two weeks, soonest first, capped at three. Completed and archived
            goals are left out. Kept exactly as it shipped for the app builds already installed,
            which render this list; current clients read `goalsAhead`.
          items:
            $ref: '#/components/schemas/BriefingGoalAheadDTO'
        recovery:
          $ref: '#/components/schemas/BriefingRecoveryWindowDTO'
        goalsAhead:
          type: array
          description: |
            The open goals closest to their end date on either side, capped at three, with their
            pace. No horizon: a goal three months out is still where the user is heading, and this
            panel is the one place each morning that says so. A goal overdue by more than two weeks
            goes to the back, because by then it has been left rather than missed, and it should
            not push out one the user is working toward. Any entry here makes the day worth showing.
          items:
            $ref: '#/components/schemas/BriefingGoalAheadDTO'
    BriefingNarrativeDTO:
      type: object
      description: |
        The generated half: a few lines per carousel page, and nothing else. The model writes
        prose and never numbers.
      properties:
        status:
          type: string
          enum:
          - PENDING
          - READY
          - UNAVAILABLE
          description: |
            `PENDING`: asked for, and the model had not answered by the request's deadline. It
            may still land; poll `GET /daily-briefing/narrative` for it.
            `READY`: the lines below are real.
            `UNAVAILABLE`: the chain refused or failed. Not retried for the rest of the day, since a
            chain in cooldown refuses the retry too and the panel reads identically either way.
            None of the three is an error.
        todayLines:
          type: array
          description: At most three lines for the "what is coming" page. Empty unless READY.
          items:
            type: string
        yesterdayLines:
          type: array
          description: At most three lines for the recap page. Empty unless READY.
          items:
            type: string
    DailyBriefingResponseDTO:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The account's own day this briefing describes.
        yesterday:
          $ref: '#/components/schemas/BriefingYesterdayRecapDTO'
        today:
          $ref: '#/components/schemas/BriefingTodayAheadDTO'
        narrative:
          $ref: '#/components/schemas/BriefingNarrativeDTO'
        seenAt:
          type: string
          format: date-time
          description: |
            When the user last acknowledged this day's dialog, or absent if never. Both clients
            read this rather than their own storage, so closing the dialog on one device closes
            it on the other.
