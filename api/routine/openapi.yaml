openapi: 3.1.0
info:
  title: Routines
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /routine/{id}:
    get:
      tags:
      - routine-controller
      operationId: getDiaryRoutineById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DiaryRoutineResponseDTO'
    put:
      tags:
      - routine-controller
      operationId: updateDiaryRoutine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryRoutineRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DiaryRoutineResponseDTO'
    delete:
      tags:
      - routine-controller
      operationId: deleteDiaryRoutine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
  /routine:
    get:
      tags:
      - routine-controller
      operationId: getAllDiaryRoutines
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaryRoutineResponseDTO'
    post:
      tags:
      - routine-controller
      operationId: createDiaryRoutine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryRoutineRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DiaryRoutineResponseDTO'
  /routine/skip:
    post:
      tags:
      - routine-controller
      operationId: skipItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipGroupRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefreshUiDTO'
  /routine/check:
    post:
      tags:
      - routine-controller
      operationId: checkItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckGroupRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefreshUiDTO'
  /routine/today:
    get:
      tags:
      - routine-controller
      operationId: getTodayRoutineScheduled
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DiaryRoutineResponseDTO'
components:
  schemas:
    BaseCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkDate:
          type: string
          format: date
        checkTime:
          type: string
        checked:
          type: boolean
        skipped:
          type: boolean
        xpGenerated:
          type: number
          format: double
    CheckGroupRequestDTO:
      type: object
      properties:
        routineId:
          type: string
          format: uuid
        taskGroupDTO:
          $ref: '#/components/schemas/TaskGroupRequestDTO'
        habitGroupDTO:
          $ref: '#/components/schemas/HabitGroupRequestDTO'
        date:
          type: string
          format: date
    DiaryRoutineRequestDTO:
      type: object
      description: >
        The create/update body for a routine, in one of two shapes. Which of the two
        collections is read depends on `type`, and sending the wrong one is a 400 rather
        than a partial apply: a DAILY routine sends `routineSections` and no `items`, a
        LIST routine sends `items` and no `routineSections`.
      properties:
        name:
          type: string
        iconId:
          type: string
        type:
          $ref: '#/components/schemas/RoutineType'
        routineSections:
          type: array
          description: >
            DAILY only. Rejected with ROUTINE_SHAPE_MISMATCH when sent for a LIST routine.
            Required and non-empty for a DAILY one, otherwise ROUTINE_SECTION_REQUIRED.
          items:
            $ref: '#/components/schemas/RoutineSectionRequestDTO'
        items:
          type: array
          description: >
            LIST only, and required and non-empty there (otherwise ROUTINE_ITEMS_REQUIRED).
            Position in this array IS the order the user sees; there is no index to send.
            Rejected with ROUTINE_SHAPE_MISMATCH when sent for a DAILY routine.
          items:
            $ref: '#/components/schemas/RoutineItemRequestDTO'
    RoutineType:
      type: string
      description: >
        The routine's shape. DAILY has sections with start and end times and items carrying
        their own windows. LIST has neither: a flat, ordered checklist ticked off at any
        point in the day. Absent on a request means DAILY, which is what keeps every client
        written before the list shape existed working unchanged. Everything around a routine
        treats the two identically — both are scheduled to weekdays, both reach the dashboard
        on their days, both are snapshotted, and both award the same XP.

        A routine cannot change type after it is created: PUT with a different `type` is
        rejected with ROUTINE_SHAPE_MISMATCH, because switching would either discard every
        time window the user set or invent times nobody chose.
      enum:
        - DAILY
        - LIST
    RoutineItemRequestDTO:
      type: object
      description: >
        One entry of a LIST routine. Exactly one of `habitId` / `taskId` must be set —
        neither, or both, is rejected with ROUTINE_ITEM_AMBIGUOUS rather than guessed at.
      properties:
        id:
          type: string
          format: uuid
          description: >
            The existing item group's id, on an update. Echo it back for every entry you are
            keeping: it is what preserves the row, and with it every check ever recorded
            against that item. Omit it for a new entry and the server assigns one.
        habitId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
    DiaryRoutineResponseDTO:
      type: object
      description: >
        A LIST routine fills BOTH collections. `items` is the flat, ordered list its clients
        render; `routineSections` carries the same items through the single internal section
        they are stored in, so the snapshot endpoints, the check endpoints and any client
        that has never heard of the list shape keep reading what they already read. A DAILY
        routine returns an empty `items`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconId:
          type: string
        type:
          $ref: '#/components/schemas/RoutineType'
        routineSections:
          type: array
          description: >
            For a LIST routine this is always exactly one section, with null start and end
            times, named after the routine. That section is an internal representation —
            build a list from `items`, not from here.
          items:
            $ref: '#/components/schemas/RoutineSectionResponseDTO'
        items:
          type: array
          description: A LIST routine's entries in the user's order. Empty for a DAILY one.
          items:
            $ref: '#/components/schemas/RoutineItemResponseDTO'
        schedule:
          $ref: '#/components/schemas/ScheduleResponseDTO'
        xp:
          type: number
          format: double
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
        level:
          type: integer
          format: int32
    RoutineItemResponseDTO:
      type: object
      description: One row of a LIST routine.
      properties:
        id:
          type: string
          format: uuid
          description: >
            The item group's id. This is what POST /routine/check and POST /routine/skip
            take — a list item is checked by exactly the call a sectioned one is.
        type:
          type: string
          enum:
            - HABIT
            - TASK
        habitId:
          type: string
          format: uuid
          description: Set when `type` is HABIT; null otherwise.
        taskId:
          type: string
          format: uuid
          description: Set when `type` is TASK; null otherwise.
        orderIndex:
          type: integer
          format: int32
          description: Position in the user's arrangement, counting from zero.
        checks:
          type: array
          description: >
            Habit and task checks share one shape here. Both carry only checkDate,
            checkTime, checked, skipped and xpGenerated, so no client can tell which it got.
          items:
            $ref: '#/components/schemas/HabitGroupCheck'
    HabitGroupCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkDate:
          type: string
          format: date
        checkTime:
          type: string
        checked:
          type: boolean
        skipped:
          type: boolean
        xpGenerated:
          type: number
          format: double
    HabitGroupDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        habitId:
          type: string
          format: uuid
        startTime:
          type: string
        endTime:
          type: string
        habitGroupCheck:
          type: array
          items:
            $ref: '#/components/schemas/HabitGroupCheck'
    HabitGroupRequestDTO:
      type: object
      properties:
        habitGroupId:
          type: string
          format: uuid
        startTime:
          type: string
    HabitGroupResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        habitId:
          type: string
          format: uuid
        startTime:
          type: string
        endTime:
          type: string
        habitGroupChecks:
          type: array
          items:
            $ref: '#/components/schemas/HabitGroupCheck'
    RefreshItemCheckedDTO:
      type: object
      properties:
        groupItemId:
          type: string
          format: uuid
        check:
          $ref: '#/components/schemas/BaseCheck'
    RefreshObjectDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
        currentStreak:
          type: integer
          format: int32
        bestStreak:
          type: integer
          format: int32
        totalCheckIns:
          type: integer
          format: int32
    RefreshUiDTO:
      type: object
      properties:
        refreshUser:
          $ref: '#/components/schemas/RefreshUserDTO'
        refreshCategories:
          type: array
          items:
            $ref: '#/components/schemas/RefreshObjectDTO'
        refreshHabit:
          $ref: '#/components/schemas/RefreshObjectDTO'
        refreshItemChecked:
          $ref: '#/components/schemas/RefreshItemCheckedDTO'
    RefreshUserDTO:
      type: object
      properties:
        currentConstance:
          type: integer
          format: int32
        alreadyIncreaseConstanceToday:
          type: boolean
        maxConstance:
          type: integer
          format: int32
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
    RoutineSectionRequestDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconId:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        taskGroup:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroupDTO'
        habitGroup:
          type: array
          items:
            $ref: '#/components/schemas/HabitGroupDTO'
        favorite:
          type: boolean
    RoutineSectionResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconId:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        taskGroup:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroupResponseDTO'
        habitGroup:
          type: array
          items:
            $ref: '#/components/schemas/HabitGroupResponseDTO'
        favorite:
          type: boolean
    ScheduleResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        days:
          type: array
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          uniqueItems: true
    SkipGroupRequestDTO:
      type: object
      properties:
        routineId:
          type: string
          format: uuid
        taskGroupDTO:
          $ref: '#/components/schemas/TaskGroupRequestDTO'
        habitGroupDTO:
          $ref: '#/components/schemas/HabitGroupRequestDTO'
        date:
          type: string
          format: date
        skip:
          type: boolean
    TaskGroupCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkDate:
          type: string
          format: date
        checkTime:
          type: string
        checked:
          type: boolean
        skipped:
          type: boolean
        xpGenerated:
          type: number
          format: double
    TaskGroupDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        startTime:
          type: string
        endTime:
          type: string
        taskGroupCheck:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroupCheck'
    TaskGroupRequestDTO:
      type: object
      properties:
        taskGroupId:
          type: string
          format: uuid
        startTime:
          type: string
    TaskGroupResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        startTime:
          type: string
        endTime:
          type: string
        taskGroupChecks:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroupCheck'
