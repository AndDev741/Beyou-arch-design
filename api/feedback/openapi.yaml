openapi: 3.1.0
info:
  title: Feedback
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /feedback:
    post:
      tags:
      - feedback-controller
      operationId: submitFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequestDTO'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackResponseDTO'
  /feedback/{feedbackId}/attachments:
    post:
      tags:
      - feedback-controller
      operationId: addAttachment
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeedbackAttachmentDTO'
  /feedback/{feedbackId}/attachments/{attachmentId}:
    get:
      tags:
      - feedback-controller
      operationId: serveAttachment
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
components:
  schemas:
    CreateFeedbackRequestDTO:
      type: object
      properties:
        category:
          type: string
          enum:
          - BUG
          - FEATURE_REQUEST
          - OTHER
        body:
          type: string
          maxLength: 4000
          minLength: 0
        context:
          $ref: '#/components/schemas/FeedbackContextDTO'
      required:
      - body
      - category
    FeedbackAttachmentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feedbackId:
          type: string
          format: uuid
        url:
          type: string
        contentType:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    FeedbackContextDTO:
      type: object
      properties:
        screen:
          type: string
          maxLength: 200
          minLength: 0
        appVersion:
          type: string
          maxLength: 40
          minLength: 0
        platform:
          type: string
          maxLength: 40
          minLength: 0
        language:
          type: string
          maxLength: 20
          minLength: 0
        theme:
          type: string
          maxLength: 40
          minLength: 0
    FeedbackResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - BUG
          - FEATURE_REQUEST
          - OTHER
        body:
          type: string
        context:
          $ref: '#/components/schemas/FeedbackContextDTO'
        createdAt:
          type: string
          format: date-time
