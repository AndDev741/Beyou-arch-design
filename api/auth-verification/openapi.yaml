openapi: 3.1.0
info:
  title: Auth verification
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /auth/verify-email:
    get:
      tags:
      - auth-verification-controller
      operationId: verifyEmail
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
