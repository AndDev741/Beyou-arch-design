openapi: 3.1.0
info:
  title: User
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /user:
    get:
      tags:
      - user-controller
      operationId: getProfile
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
    put:
      tags:
      - user-controller
      operationId: editUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEditDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /user/deletion/confirm:
    post:
      tags:
      - user-controller
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAccountDeletionDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /user/deletion/code:
    post:
      tags:
      - user-controller
      operationId: requestDeletionCode
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    ConfirmAccountDeletionDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: \d{6}
      required:
      - code
    UserEditDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 0
          pattern: .*\S.*\S.*
        photo:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: (?i)^(?:$|https?://.+|/api/v1/user/photo/.+)
        phrase:
          type: string
          maxLength: 256
          minLength: 0
        phrase_author:
          type: string
          maxLength: 256
          minLength: 0
        widgetsId:
          type: array
          items:
            type: string
        theme:
          type: string
        constanceConfiguration:
          type: string
          enum:
          - ANY
          - COMPLETE
        language:
          type: string
        isTutorialCompleted:
          type: boolean
        timezone:
          type: string
        timezoneSource:
          type: string
          description: >-
            How the accompanying `timezone` was arrived at. Only `DETECTED` is
            meaningful from a client, and it is a request rather than an
            instruction: the server honours it only while the account is still
            `DEFAULT`. Omit it for a zone the PERSON picked — that is read as
            explicit and becomes permanent. `DEFAULT` is rejected.
          enum:
          - DETECTED
        xpDecayStrategy:
          type: string
          enum:
          - GRADUAL
          - FLAT
          - TIME_WINDOW
    UserResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The account's opaque UUID. The only identity product analytics may
            use — the email is never sent to an analytics vendor.
        name:
          type: string
        email:
          type: string
        phrase:
          type: string
        phrase_author:
          type: string
        constance:
          type: integer
          format: int32
        constanceDormant:
          type: boolean
        photo:
          type: string
        isGoogleAccount:
          type: boolean
        widgetsId:
          type: array
          items:
            type: string
        themeInUse:
          type: string
        xp:
          type: number
          format: double
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        constanceConfiguration:
          type: string
          enum:
          - ANY
          - COMPLETE
        constanceIncreaseToday:
          type: boolean
        maxConstance:
          type: integer
          format: int32
        isTutorialCompleted:
          type: boolean
        languageInUse:
          type: string
        timezone:
          type: string
        timezoneSource:
          type: string
          description: >-
            Whether `timezone` was ever actually chosen. `DEFAULT` means nobody
            has answered and a client-detected zone may be adopted over it, once.
            `DETECTED` means a client already reported one; a mismatch is
            surfaced as a suggestion rather than adopted, so a device opened in
            another country cannot move a travelling user's day boundary.
            `EXPLICIT` means a person picked it and nothing changes it
            automatically.
          enum:
          - DEFAULT
          - DETECTED
          - EXPLICIT
        xpDecayStrategy:
          type: string
          enum:
          - GRADUAL
          - FLAT
          - TIME_WINDOW
        createdAt:
          type: string
          description: >-
            The day the account was created, ISO-8601 (`2026-03-14`). A date and
            not an instant because that is all the column behind it holds, and it
            is the server's calendar day rather than the user's — precise enough
            to bucket an account by age, not enough to reason about signup time.
            Sent so the clients can report it to product analytics as the signup
            date: the analytics provider's own first-seen timestamp answers when
            it first saw the account, which for anything older than the
            instrumentation is a different date. Absent on an account created
            before the column existed.
