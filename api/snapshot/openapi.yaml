openapi: 3.1.0
info:
  title: Routine snapshots
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /routine/snapshot/skip:
    post:
      tags:
      - snapshot-controller
      operationId: skipSnapshotItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCheckRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefreshUiDTO'
  /routine/snapshot/check:
    post:
      tags:
      - snapshot-controller
      operationId: checkSnapshotItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCheckRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefreshUiDTO'
  /routine/{routineId}/snapshots:
    get:
      tags:
      - snapshot-controller
      operationId: getSnapshotDatesForMonth
      parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SnapshotMonthResponseDTO'
  /routine/{routineId}/snapshot:
    get:
      tags:
      - snapshot-controller
      operationId: getSnapshot
      parameters:
      - name: routineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SnapshotResponseDTO'
  /routine/snapshot:
    get:
      tags:
      - snapshot-controller
      operationId: getSnapshotsForDay
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotResponseDTO'
components:
  schemas:
    BaseCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        checkDate:
          type: string
          format: date
        checkTime:
          type: string
        checked:
          type: boolean
        skipped:
          type: boolean
        xpGenerated:
          type: number
          format: double
    RefreshItemCheckedDTO:
      type: object
      properties:
        groupItemId:
          type: string
          format: uuid
        check:
          $ref: '#/components/schemas/BaseCheck'
    RefreshObjectDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
        currentStreak:
          type: integer
          format: int32
        bestStreak:
          type: integer
          format: int32
        totalCheckIns:
          type: integer
          format: int32
    RefreshUiDTO:
      type: object
      properties:
        refreshUser:
          $ref: '#/components/schemas/RefreshUserDTO'
        refreshCategories:
          type: array
          items:
            $ref: '#/components/schemas/RefreshObjectDTO'
        refreshHabit:
          $ref: '#/components/schemas/RefreshObjectDTO'
        refreshItemChecked:
          $ref: '#/components/schemas/RefreshItemCheckedDTO'
    RefreshUserDTO:
      type: object
      properties:
        currentConstance:
          type: integer
          format: int32
        alreadyIncreaseConstanceToday:
          type: boolean
        maxConstance:
          type: integer
          format: int32
        xp:
          type: number
          format: double
        level:
          type: integer
          format: int32
        actualLevelXp:
          type: number
          format: double
        nextLevelXp:
          type: number
          format: double
    SnapshotCheckRequestDTO:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
        snapshotCheckId:
          type: string
          format: uuid
      required:
      - snapshotCheckId
      - snapshotId
    SnapshotCheckResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        itemType:
          type: string
          enum:
          - HABIT
          - TASK
        itemName:
          type: string
        itemIconId:
          type: string
        sectionName:
          type: string
        originalGroupId:
          type: string
          format: uuid
        difficulty:
          type: integer
          format: int32
        importance:
          type: integer
          format: int32
        checked:
          type: boolean
        skipped:
          type: boolean
        checkTime:
          type: string
        xpGenerated:
          type: number
          format: double
        microTasks:
          type: array
          description: |
            The Focus Mode's micro-tasks done on this item that day, joined server-side on
            originalGroupId. Absent from snapshots written before the Focus Mode existed.
          items:
            $ref: '#/components/schemas/FocusMicroTaskResponseDTO'
        pomodoros:
          type: integer
          format: int32
          description: Completed POMODORO cycles on this item that day. Breaks do not count.
    FocusCycleResponseDTO:
      type: object
      description: A completed Focus Mode cycle. Defined in full in api/focus/openapi.yaml.
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        itemGroupId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - POMODORO
          - SHORT_BREAK
          - LONG_BREAK
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        minutes:
          type: integer
          format: int32
    FocusMicroTaskResponseDTO:
      type: object
      description: One micro-task on one routine item. Defined in full in api/focus/openapi.yaml.
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        itemGroupId:
          type: string
          format: uuid
        name:
          type: string
        pinned:
          type: boolean
        doneAt:
          type: string
          format: date-time
    SnapshotMonthResponseDTO:
      type: object
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
    SnapshotResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routineId:
          type: string
          format: uuid
        snapshotDate:
          type: string
          format: date
        routineName:
          type: string
        routineIconId:
          type: string
        completed:
          type: boolean
        structure:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotCheckResponseDTO'
        focusCycles:
          type: array
          description: |
            Every Focus Mode cycle of the day that ran on one of this routine's items, plus every
            cycle that ran on no item at all — a pomodoro started with nothing selected still
            happened that day and has nowhere else to appear. Absent from older snapshots.
          items:
            $ref: '#/components/schemas/FocusCycleResponseDTO'
