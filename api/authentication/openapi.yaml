openapi: 3.1.0
info:
  title: Authentication
  version: v0
servers:
- url: http://localhost:8099/api/v1
  description: Generated server url
paths:
  /auth/reset-password:
    post:
      tags:
      - authentication-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /auth/register:
    post:
      tags:
      - authentication-controller
      operationId: doRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /auth/refresh:
    post:
      tags:
      - authentication-controller
      operationId: refreshAccess
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /auth/logout:
    post:
      tags:
      - authentication-controller
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /auth/login:
    post:
      tags:
      - authentication-controller
      operationId: doLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /auth/google/mobile:
    post:
      tags:
      - authentication-controller
      operationId: googleMobileAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleMobileLoginDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /auth/forgot-password:
    post:
      tags:
      - authentication-controller
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /auth/verify:
    get:
      tags:
      - authentication-controller
      operationId: verifyAuthentication
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /auth/reset-password/validate:
    get:
      tags:
      - authentication-controller
      operationId: validateResetPasswordToken
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /auth/google:
    get:
      tags:
      - authentication-controller
      operationId: googleAuth
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: timezone
        in: query
        required: false
        description: >-
          The IANA zone the browser detected. Applied only when this callback
          CREATES the account; an existing one keeps what it has.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    ForgotPasswordRequestDTO:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 256
          minLength: 0
      required:
      - email
    GoogleMobileLoginDTO:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
        timezone:
          type: string
          description: >-
            The device's IANA zone. Sent alongside the token because a verified
            Google ID token carries no such claim. Applied only when this
            sign-in CREATES the account; an existing one keeps what it has.
      required:
      - idToken
    ResetPasswordRequestDTO:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - token
    UserLoginDTO:
      type: object
      properties:
        email:
          type: string
          maxLength: 256
          minLength: 0
        password:
          type: string
          maxLength: 300
          minLength: 0
      required:
      - email
      - password
    UserRegisterDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 256
          minLength: 0
        password:
          type: string
          minLength: 1
        timezone:
          type: string
          description: >-
            The IANA zone the client detected on the device, e.g.
            `Europe/Lisbon`. Optional: an older client that omits it still
            registers, and the account falls back to `UTC` with a
            `timezoneSource` of `DEFAULT`. A value the server cannot parse is
            dropped rather than refusing the registration.
      required:
      - email
      - name
      - password
